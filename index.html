<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question du jour · Équipe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1a1a18;
  --ink2:#5a5a56;
  --ink3:#9a9a94;
  --paper:#fafaf7;
  --white:#ffffff;
  --line:#e8e8e2;
  --accent:#2d6a4f;
  --accent-bg:#eef6f2;
  --accent-mid:#52b788;
  --warm:#b5451b;
  --warm-bg:#fdf0eb;
  --r:10px;
  --rs:6px;
}

body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}

.view{display:none}
.view.on{display:block}

/* ── TOP BAR ── */
.topbar{background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;height:52px;gap:8px}
.logo{font-weight:700;font-size:16px;color:var(--accent);flex:1;letter-spacing:-0.3px}
.nav-btn{padding:6px 14px;border:none;background:none;font-size:13px;color:var(--ink2);cursor:pointer;border-radius:var(--rs);font-family:inherit;transition:all .15s}
.nav-btn:hover,.nav-btn.on{background:var(--accent-bg);color:var(--accent);font-weight:500}

/* ── QUESTION BANNER ── */
.q-banner{background:var(--accent);padding:28px 24px 24px;text-align:center}
.q-banner .day-label{display:inline-block;background:rgba(255,255,255,0.18);color:#fff;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;padding:4px 12px;border-radius:99px;margin-bottom:14px}
.q-banner h1{color:#fff;font-size:clamp(18px,4vw,26px);font-weight:600;max-width:580px;margin:0 auto;line-height:1.35}

/* ── FORM ── */
.form-section{max-width:520px;margin:0 auto;padding:24px 20px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--rs);font-size:14px;font-family:inherit;background:var(--white);color:var(--ink);outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--accent-mid)}
.field textarea{min-height:90px;resize:none}

.btn-send{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s;margin-top:4px}
.btn-send:hover{background:#235c43}
.btn-send:active{transform:scale(.98)}

/* ── RESPONSES WALL ── */
.wall-header{display:flex;align-items:center;gap:10px;padding:18px 20px 10px;max-width:520px;margin:0 auto}
.wall-title{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.count-pill{background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}

.wall{max-width:520px;margin:0 auto;padding:0 20px 32px;display:flex;flex-direction:column;gap:10px}

.resp-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.resp-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.resp-name{font-size:14px;font-weight:600;color:var(--ink)}
.resp-time{font-size:12px;color:var(--ink3);margin-left:auto}
.resp-text{font-size:14px;color:var(--ink2);line-height:1.55}

.empty-wall{text-align:center;padding:32px 20px;color:var(--ink3)}
.empty-wall svg{margin-bottom:12px;opacity:.4}
.empty-wall p{font-size:14px}

/* ── SUCCESS ── */
.success-banner{max-width:520px;margin:16px auto;background:var(--accent-bg);border:1px solid var(--accent-mid);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:12px}
.check-circle{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.success-text strong{display:block;font-size:14px;color:var(--accent);margin-bottom:2px}
.success-text span{font-size:13px;color:var(--ink2)}

/* ── CLOSED ── */
.closed-box{text-align:center;padding:48px 24px;max-width:460px;margin:0 auto}
.closed-icon{width:56px;height:56px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.closed-box h2{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:8px}
.closed-box p{font-size:14px;color:var(--ink2)}

/* ── ADMIN ── */
.admin-wrap{max-width:680px;margin:0 auto;padding:24px 20px}

.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:12px}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}

.qr-row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
#qrcode canvas,#qrcode img{border-radius:6px;display:block}
.qr-meta{flex:1;min-width:180px}
.qr-meta p{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:12px}
.url-mono{background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);padding:8px 12px;font-size:12px;font-family:monospace;color:var(--ink);word-break:break-all;margin-bottom:10px}
.btn-copy{padding:7px 16px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-mid);border-radius:var(--rs);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s}
.btn-copy:hover{background:#d4ede4}

.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.add-row .field{flex:1;min-width:140px;margin-bottom:0}
.btn-add{padding:11px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-add:hover{background:#235c43}

.q-list{list-style:none;display:flex;flex-direction:column;gap:0}
.q-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.q-item:last-child{border-bottom:none}
.q-date-tag{font-size:11px;font-weight:700;background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.q-date-tag.past{background:#f0f0ec;color:var(--ink3)}
.q-date-tag.today{background:var(--accent);color:#fff}
.q-label{font-size:13px;color:var(--ink);flex:1}
.btn-del{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:15px;padding:4px;border-radius:4px;flex-shrink:0;transition:color .15s}
.btn-del:hover{color:var(--warm)}

.admin-resp-item{padding:11px 0;border-bottom:1px solid var(--line)}
.admin-resp-item:last-child{border-bottom:none}
.admin-resp-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ava-sm{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ari-name{font-size:13px;font-weight:600}
.ari-date{font-size:11px;color:var(--ink3);margin-left:auto}
.ari-q{font-size:11px;color:var(--ink3);font-style:italic;margin-bottom:3px;padding-left:36px}
.ari-ans{font-size:13px;color:var(--ink2);padding-left:36px;line-height:1.5}

.filter-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.flt{padding:5px 12px;background:none;border:1px solid var(--line);border-radius:99px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink2);transition:all .15s}
.flt.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border-radius:var(--rs);padding:12px;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--accent)}
.stat-l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);padding:3px;margin-bottom:16px}
.tab{flex:1;padding:7px;background:none;border:none;border-radius:5px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink2);transition:all .15s}
.tab.on{background:var(--white);color:var(--ink);font-weight:600;border:1px solid var(--line)}

.tc{display:none}.tc.on{display:block}

@media(max-width:480px){
  .topbar{padding:0 12px}
  .q-banner{padding:20px 16px}
  .form-section,.wall,.admin-wrap{padding-left:12px;padding-right:12px}
  .stat-row{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">◆ Question du jour</span>
  <button class="nav-btn on" id="nb-public" onclick="goView('public')">Aujourd'hui</button>
  <button class="nav-btn" id="nb-admin" onclick="goView('admin')">Admin</button>
</div>

<!-- ═══════════ VUE PUBLIQUE ═══════════ -->
<div class="view on" id="view-public">
  <div id="pub-root"></div>
</div>

<!-- ═══════════ VUE ADMIN ═══════════ -->
<div class="view" id="view-admin">
  <div class="admin-wrap">

    <div class="tabs">
      <button class="tab on" onclick="aTab('at-qr',this)">QR Code</button>
      <button class="tab" onclick="aTab('at-questions',this)">Questions</button>
      <button class="tab" onclick="aTab('at-responses',this)">Réponses</button>
    </div>

    <div class="tc on" id="at-qr">
      <div class="card">
        <p class="section-title">QR code à scanner</p>
        <div class="qr-row">
          <div id="qrcode"></div>
          <div class="qr-meta">
            <p>Imprimez ce QR code ou affichez-le à l'entrée du bureau. Chaque collègue le scanne, répond, et voit les réponses des autres.</p>
            <div class="url-mono" id="qr-url">—</div>
            <button class="btn-copy" onclick="doCopy()">Copier le lien</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tc" id="at-questions">
      <div class="card">
        <p class="section-title">Ajouter une question</p>
        <div class="add-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="inp-date" />
          </div>
          <div class="field" style="flex:2">
            <label>Question</label>
            <input type="text" id="inp-q" placeholder="Ex : Quel est votre lieu de travail idéal ?" />
          </div>
          <button class="btn-add" onclick="doAddQ()">Ajouter</button>
        </div>
      </div>
      <div class="card">
        <p class="section-title">Planning</p>
        <ul class="q-list" id="q-list"><li style="font-size:13px;color:var(--ink3);padding:10px 0">Aucune question planifiée.</li></ul>
      </div>
    </div>

    <div class="tc" id="at-responses">
      <div class="stat-row" id="admin-stats"></div>
      <div class="filter-wrap" id="admin-filters"></div>
      <div class="card" id="admin-resp-list"></div>
    </div>

  </div>
</div>

<script>
const QK = 'qdj2_questions';
const RK = 'qdj2_responses';
const SESS_K = 'qdj2_sess';
let activeFilter = 'all';

function getQ(){try{return JSON.parse(localStorage.getItem(QK))||[]}catch{return[]}}
function setQ(a){localStorage.setItem(QK,JSON.stringify(a))}
function getR(){try{return JSON.parse(localStorage.getItem(RK))||[]}catch{return[]}}
function setR(a){localStorage.setItem(RK,JSON.stringify(a))}

function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function fmtDay(d){const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];const date=new Date(d+'T12:00:00');return days[date.getDay()]}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}

function getSess(){
  let s=sessionStorage.getItem(SESS_K);
  if(!s){s=Math.random().toString(36).slice(2);sessionStorage.setItem(SESS_K,s)}
  return s
}

function goView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  document.getElementById('nb-'+v).classList.add('on');
  if(v==='public')renderPublic();
  if(v==='admin'){renderQR();renderQList();renderAdminResp()}
}

/* ─── PUBLIQUE ─── */
function renderPublic(){
  const t=today();
  const qs=getQ();
  const q=qs.find(x=>x.date===t);
  const root=document.getElementById('pub-root');
  if(!q){
    root.innerHTML=`<div class="closed-box">
      <div class="closed-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <h2>Pas de question aujourd'hui</h2>
      <p>L'administrateur n'a pas encore planifié de question pour aujourd'hui. Revenez demain !</p>
    </div>`;
    return;
  }
  const rs=getR();
  const alreadyDone=rs.some(r=>r.date===t&&r._sess===getSess());
  root.innerHTML=`
    <div class="q-banner">
      <div class="day-label">${fmtDay(t)} ${fmtDate(t)}</div>
      <h1>${esc(q.text)}</h1>
    </div>`;
  if(!alreadyDone){
    root.innerHTML+=`
    <div class="form-section">
      <div class="field"><label>Votre prénom</label><input id="inp-name" type="text" placeholder="ex : Sophie" autocomplete="given-name"/></div>
      <div class="field"><label>Votre réponse</label><textarea id="inp-ans" placeholder="Écrivez librement…"></textarea></div>
      <button class="btn-send" onclick="doSubmit()">Envoyer et voir les réponses →</button>
    </div>`;
  } else {
    root.innerHTML+=`
    <div class="success-banner" style="max-width:520px;margin:16px auto">
      <div class="check-circle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="success-text"><strong>Réponse enregistrée !</strong><span>Voici ce que l'équipe a répondu aujourd'hui.</span></div>
    </div>`;
  }
  renderWall(t,root,alreadyDone);
}

function renderWall(dateStr,root,show){
  if(!show)return;
  const rs=getR().filter(r=>r.date===dateStr);
  const avatarColors=['#2d6a4f','#1d6496','#7a4f8a','#b5451b','#5f6500'];
  const wallDiv=document.createElement('div');
  if(!rs.length){
    wallDiv.innerHTML=`<div class="empty-wall"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>Soyez le premier à répondre !</p></div>`;
  } else {
    wallDiv.innerHTML=`<div class="wall-header"><span class="wall-title">Réponses de l'équipe</span><span class="count-pill">${rs.length}</span></div>`;
    wallDiv.innerHTML+=`<div class="wall">${rs.map((r,i)=>`
      <div class="resp-card">
        <div class="resp-top">
          <div class="avatar" style="background:${avatarColors[i%avatarColors.length]}20;color:${avatarColors[i%avatarColors.length]}">${initials(r.name)}</div>
          <span class="resp-name">${esc(r.name)}</span>
          <span class="resp-time">${r.time}</span>
        </div>
        <div class="resp-text">${esc(r.answer)}</div>
      </div>`).join('')}</div>`;
  }
  root.appendChild(wallDiv);
}

function doSubmit(){
  const name=(document.getElementById('inp-name')||{}).value?.trim();
  const ans=(document.getElementById('inp-ans')||{}).value?.trim();
  if(!name){alert('Entrez votre prénom.');return}
  if(!ans){alert('Écrivez une réponse.');return}
  const t=today();
  const qs=getQ();
  const q=qs.find(x=>x.date===t);
  if(!q)return;
  const rs=getR();
  rs.push({date:t,questionText:q.text,name,answer:ans,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),_sess:getSess()});
  setR(rs);
  renderPublic();
}

/* ─── ADMIN: QR ─── */
function renderQR(){
  const url=location.href.split('?')[0];
  document.getElementById('qr-url').textContent=url;
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'),{text:url,width:148,height:148,colorDark:'#1a1a18',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
}

function doCopy(){
  navigator.clipboard.writeText(document.getElementById('qr-url').textContent).then(()=>{
    const b=document.querySelector('.btn-copy');b.textContent='Copié ✓';
    setTimeout(()=>b.textContent='Copier le lien',2000);
  });
}

/* ─── ADMIN: Questions ─── */
function renderQList(){
  const qs=getQ().slice().sort((a,b)=>a.date.localeCompare(b.date));
  const t=today();
  const ul=document.getElementById('q-list');
  if(!qs.length){ul.innerHTML='<li style="font-size:13px;color:var(--ink3);padding:10px 0">Aucune question planifiée.</li>';return}
  ul.innerHTML=qs.map((q,i)=>{
    const cls=q.date<t?'past':q.date===t?'today':'';
    const label=q.date===t?'Aujourd\'hui':q.date<t?'Passée':'';
    return`<li class="q-item">
      <span class="q-date-tag ${cls}">${fmtDate(q.date)}${label?' · '+label:''}</span>
      <span class="q-label">${esc(q.text)}</span>
      <button class="btn-del" onclick="doDelQ(${i})" title="Supprimer">✕</button>
    </li>`;
  }).join('');
}

function doAddQ(){
  const date=document.getElementById('inp-date').value;
  const text=document.getElementById('inp-q').value.trim();
  if(!date||!text){alert('Remplissez la date et la question.');return}
  const qs=getQ();
  if(qs.some(q=>q.date===date)){alert('Une question existe déjà pour cette date.');return}
  qs.push({date,text});setQ(qs);
  document.getElementById('inp-q').value='';
  renderQList();
}

function doDelQ(i){
  if(!confirm('Supprimer cette question ?'))return;
  const qs=getQ().slice().sort((a,b)=>a.date.localeCompare(b.date));
  qs.splice(i,1);setQ(qs);renderQList();
}

/* ─── ADMIN: Réponses ─── */
function renderAdminResp(){
  const rs=getR();
  const dates=[...new Set(rs.map(r=>r.date))].sort((a,b)=>b.localeCompare(a));
  const filtered=activeFilter==='all'?rs:rs.filter(r=>r.date===activeFilter);

  const statsEl=document.getElementById('admin-stats');
  const today_count=rs.filter(r=>r.date===today()).length;
  statsEl.innerHTML=`
    <div class="stat"><div class="stat-n">${rs.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n">${today_count}</div><div class="stat-l">Aujourd'hui</div></div>
    <div class="stat"><div class="stat-n">${dates.length}</div><div class="stat-l">Jours actifs</div></div>`;

  const filtersEl=document.getElementById('admin-filters');
  filtersEl.innerHTML=`<button class="flt${activeFilter==='all'?' on':''}" onclick="setFilter('all')">Toutes</button>`
    +dates.map(d=>`<button class="flt${activeFilter===d?' on':''}" onclick="setFilter('${d}')">${fmtDate(d)}</button>`).join('');

  const listEl=document.getElementById('admin-resp-list');
  if(!filtered.length){listEl.innerHTML='<p style="font-size:13px;color:var(--ink3);padding:8px 0">Aucune réponse.</p>';return}
  listEl.innerHTML=filtered.map(r=>`
    <div class="admin-resp-item">
      <div class="admin-resp-top">
        <div class="ava-sm">${initials(r.name)}</div>
        <span class="ari-name">${esc(r.name)}</span>
        <span class="ari-date">${fmtDate(r.date)} · ${r.time}</span>
      </div>
      <div class="ari-q">${esc(r.questionText||'')}</div>
      <div class="ari-ans">${esc(r.answer)}</div>
    </div>`).join('');
}

function setFilter(f){activeFilter=f;renderAdminResp()}

function aTab(id,btn){
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
  if(id==='at-qr')renderQR();
  if(id==='at-responses')renderAdminResp();
}

/* ─── INIT ─── */
document.getElementById('inp-date').value=today();

if(!getQ().length){
  const t=new Date();
  const d1=new Date(t);d1.setDate(t.getDate()+1);
  const d2=new Date(t);d2.setDate(t.getDate()+2);
  const fmt=d=>d.toISOString().slice(0,10);
  setQ([
    {date:today(),text:"Si vous pouviez changer une chose dans notre façon de travailler en équipe, ce serait quoi ?"},
    {date:fmt(d1),text:"Quel est le projet dont vous êtes le plus fier(e) ces derniers mois ?"},
    {date:fmt(d2),text:"Quelle compétence aimeriez-vous développer cette année ?"}
  ]);
}
